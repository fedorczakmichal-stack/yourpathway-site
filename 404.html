<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex">
  <title>Page not found · Pathway</title>
  <style>
    :root{color-scheme:light}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#071d18;color:#efe3d0;font:16px/1.6 Georgia,serif}
    .card{max-width:30rem;text-align:center}
    h1{font-size:clamp(26px,6vw,34px);font-weight:500;line-height:1.15;margin-bottom:14px}
    p{opacity:.85;margin-bottom:8px}
    a.cta{display:inline-block;margin:20px 8px 0;padding:13px 24px;border-radius:12px;background:#d6b273;color:#071d18;font:700 15px/1 system-ui,-apple-system,sans-serif;text-decoration:none}
    a.line{display:inline-block;margin:20px 8px 0;padding:12px 22px;border-radius:12px;border:1px solid rgba(214,178,115,.6);color:#efe3d0;font:700 15px/1 system-ui,-apple-system,sans-serif;text-decoration:none}
    a:focus-visible{outline:3px solid #d6b273;outline-offset:3px}
  </style>
</head>
<body>
  <main class="card">
    <h1>This street does not exist.</h1>
    <p>The address has a typo, or the page has moved.</p>
    <p lang="pl">Ten adres nie istnieje — literówka albo strona się przeniosła.</p>
    <a class="cta" href="/">Beta page</a>
    <a class="line" href="/app/">Open the app</a>
  </main>
</body>
</html>
